# L05 桩 —— GRUB 配置与 ISO 制作规则
# kernel.elf 已能被 GRUB 认出（L04 成果），本课让它真正被引导：
#   1) 写 grub.cfg：timeout=0 直接引导，menuentry 里用 multiboot 命令加载
#      /boot/kernel.elf 并 boot
#   2) Makefile 里补全 grub-mkrescue 制 ISO 的规则
#
# GRUB 怎么找到配置？ISO 里 boot/grub/grub.cfg 是约定路径。

set timeout=0
set default=0

